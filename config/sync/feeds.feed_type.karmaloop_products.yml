uuid: c740a20d-b5c3-4d87-9d15-c55b9f0f418c
langcode: en
status: true
dependencies:
  config:
    - field.field.node.digital_product.field_digital_brand
    - field.field.node.digital_product.field_digital_category
    - field.field.node.digital_product.field_digital_currency
    - field.field.node.digital_product.field_digital_description
